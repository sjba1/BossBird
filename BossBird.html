<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport 关掉缩放，手机上点按更跟手 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boss Bird - 飞行小鸟</title>
<!-- PWA：让游戏能「添加到主屏幕」并离线缓存 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15162b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%;
    background:#15162b;
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow:hidden;
  }
  #wrap { position:relative; }
  /* 画布就是整个游戏界面，所有画面都用 JS 画在上面 */
  canvas {
    display:block;
    background:#70c5ce;
    border-radius:14px;
    box-shadow:0 12px 50px rgba(0,0,0,.45);
    touch-action:none;            /* 阻止手机上滑动误触 */
  }
  /* 登录浮层 */
  #loginOverlay {
    position:fixed; inset:0;
    background:rgba(10,11,25,.93);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
  }
  .loginCard {
    width:300px; max-width:86vw;
    background:#1e2040; border:1px solid #33345f; border-radius:16px;
    padding:22px 20px; box-shadow:0 12px 50px rgba(0,0,0,.5);
  }
  .loginTitle { color:#ffe08a; text-align:center; font-size:20px; font-weight:bold; margin-bottom:16px; }
  #loginOverlay input {
    width:100%; box-sizing:border-box; padding:11px 12px; margin-bottom:10px;
    border-radius:10px; border:1px solid #3a3c66; background:#15162b; color:#fff; font-size:15px;
  }
  .liErr { color:#ff8080; font-size:12px; min-height:16px; margin-bottom:8px; text-align:center; }
  .liBtn { width:100%; padding:11px; border:none; border-radius:10px; font-size:15px; font-weight:bold; margin-bottom:8px; cursor:pointer;
    transition: transform .06s ease, filter .12s ease, box-shadow .06s ease, opacity .15s ease; }
  .liPrimary { background:#ffd33d; color:#3a2c00; box-shadow:0 3px 0 #c9a417; }   /* 底部硬阴影 = 立体凸起 */
  .liPrimary:hover  { filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 4px 0 #c9a417; }
  .liPrimary:active { transform:translateY(2px); box-shadow:0 1px 0 #c9a417; filter:brightness(.93); }  /* 按下：下沉 + 阴影压扁 = 实体按压感 */
  .liBtn:not(.liPrimary) { background:#3a3c66; color:#fff; }
  .liBtn:not(.liPrimary):hover  { filter:brightness(1.12); }
  .liBtn:not(.liPrimary):active { transform:translateY(2px); filter:brightness(.9); }
  .liBtn:disabled { opacity:.55; cursor:default; filter:none; transform:none; box-shadow:none; }  /* 请求中：变灰禁用，明确"已点·处理中" */
  .liBtn:focus-visible { outline:2px solid #ffe08a; outline-offset:2px; }
  .liGuest { width:100%; background:none; border:none; color:#8a8cc0; font-size:12px; cursor:pointer; text-decoration:underline; }
  /* 好友浮层：好友码 + 添加好友 + 排行榜 */
  #friendsOverlay {
    position:fixed; inset:0;
    background:rgba(10,11,25,.93);
    display:none; align-items:center; justify-content:center;
    z-index:60;
  }
  .friendCard {
    width:320px; max-width:86vw; max-height:82vh; overflow-y:auto;
    background:#1e2040; border:1px solid #33345f; border-radius:16px;
    padding:20px 18px; box-shadow:0 12px 50px rgba(0,0,0,.5);
    color:#fff;
  }
  .fTitle { color:#ffe08a; text-align:center; font-size:19px; font-weight:bold; margin-bottom:12px; }
  .fLabel { font-size:12px; color:#9a9cc8; margin:10px 0 6px; }
  .fUidRow { display:flex; align-items:center; gap:8px; }
  .fUid {
    flex:1; background:#15162b; border:1px solid #3a3c66; border-radius:10px;
    padding:10px 12px; font-size:20px; font-weight:bold; letter-spacing:1px;
    color:#ffe08a; text-align:center; font-family:monospace; user-select:all;
  }
  .fCopy { padding:9px 12px; border:none; border-radius:10px; background:#3a3c66; color:#fff;
    font-size:13px; font-weight:bold; cursor:pointer; }
  .fCopy:active { transform:translateY(2px); }
  .fAddRow { display:flex; gap:8px; }
  .fAddRow input {
    flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid #3a3c66;
    background:#15162b; color:#fff; font-size:14px; text-transform:uppercase; letter-spacing:1px;
  }
  .fAddBtn { padding:10px 14px; border:none; border-radius:10px; background:#ffd33d; color:#3a2c00;
    font-size:14px; font-weight:bold; cursor:pointer; }
  .fAddBtn:disabled { opacity:.55; }
  .fErr { color:#ff8080; font-size:12px; min-height:16px; margin:6px 0 2px; }
  .fOk  { color:#7fe08a; font-size:12px; min-height:16px; margin:6px 0 2px; }
  .fRow {
    display:flex; align-items:center; padding:7px 10px; border-radius:8px;
    background:rgba(255,255,255,.05); margin-bottom:6px;
  }
  /* 排行榜里的「我」：金边高亮，一眼区分 */
  .fMe { background:rgba(255,211,61,.16); border:1px solid rgba(255,211,61,.45); }
  .fMe .fName, .fMe .fBest { color:#ffe08a; font-weight:bold; }
  .fRank { width:30px; font-weight:bold; font-size:14px; }
  .fName { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fBest { font-size:13px; font-weight:bold; color:#ffe08a; }
  .fEmpty { text-align:center; color:#8a8cc0; font-size:13px; padding:14px 0; }
  .fClose { width:100%; margin-top:10px; padding:10px; border:none; border-radius:10px;
    background:#3a3c66; color:#fff; font-size:14px; font-weight:bold; cursor:pointer; }
  .fClose:active { transform:translateY(2px); }
  .fTip { font-size:11px; color:#8a8cc0; text-align:center; margin-top:8px; }
  /* 好友面板里的「查看排行榜」入口按钮 */
  .fRankBtn { width:100%; margin-top:8px; padding:11px; border:none; border-radius:10px;
    background:#ffd33d; color:#3a2c00; font-size:14px; font-weight:bold; cursor:pointer; }
  .fRankBtn:active { transform:translateY(2px); }
  /* 排行榜浮层（独立一页） */
  #rankOverlay {
    position:fixed; inset:0; background:rgba(10,11,25,.93);
    display:none; align-items:center; justify-content:center; z-index:70;
  }
  .rankCard {
    width:320px; max-width:86vw; max-height:82vh; overflow-y:auto;
    background:#1e2040; border:1px solid #33345f; border-radius:16px;
    padding:20px 18px; box-shadow:0 12px 50px rgba(0,0,0,.5); color:#fff;
  }
  /* 技能图鉴浮层：独立一页，列出全部皮肤及技能说明 */
  #skillCodexOverlay {
    position:fixed; inset:0; background:rgba(10,11,25,.93);
    display:none; align-items:center; justify-content:center; z-index:75;
  }
  .skillCard {
    width:330px; max-width:88vw; max-height:84vh; overflow-y:auto;
    background:#1e2040; border:1px solid #33345f; border-radius:16px;
    padding:18px 16px; box-shadow:0 12px 50px rgba(0,0,0,.5); color:#fff;
  }
  .skillTitle { color:#ffe08a; text-align:center; font-size:19px; font-weight:bold; margin-bottom:4px; }
  .skillSub { text-align:center; font-size:11px; color:#8a8cc0; margin-bottom:12px; }
  /* 单个皮肤条目 */
  .skillRow {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:11px 12px; margin-bottom:10px;
  }
  .skillHead { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .skillDot { width:18px; height:18px; border-radius:50%; flex:none; border:1.5px solid rgba(255,255,255,.7); }
  .skillName { font-size:15px; font-weight:bold; color:#fff; }
  .skillTag { margin-left:auto; font-size:11px; padding:2px 8px; border-radius:9px; }
  .skillTag.owned { background:rgba(126,224,168,.18); color:#9effa0; }
  .skillTag.locked { background:rgba(255,128,128,.16); color:#ff9a9a; }
  .skillTag.none { background:rgba(255,255,255,.1); color:#bbb; }
  .skillSkill { font-size:13px; color:#ffe08a; font-weight:bold; margin-bottom:5px; }
  .skillDesc { font-size:12.5px; line-height:1.55; color:#d6d8f0; }
  .skillClose { width:100%; margin-top:4px; padding:10px; border:none; border-radius:10px;
    background:#3a3c66; color:#fff; font-size:14px; font-weight:bold; cursor:pointer; }
  .skillClose:active { transform:translateY(2px); }
  /* 皮肤商店浮层：从底部「皮肤商店 ›」或点未拥有的皮肤进入，可浏览 / 购买 / 装备 */
  #shopOverlay {
    position:fixed; inset:0; background:rgba(10,11,25,.93);
    display:none; align-items:center; justify-content:center; z-index:80;
  }
  .shopCard {
    width:340px; max-width:90vw; max-height:86vh; overflow-y:auto;
    background:#1e2040; border:1px solid #33345f; border-radius:16px;
    padding:18px 16px; box-shadow:0 12px 50px rgba(0,0,0,.5); color:#fff;
  }
  .shopTitle { color:#ffe08a; text-align:center; font-size:19px; font-weight:bold; margin-bottom:2px; }
  .shopWallet {
    background:rgba(255,211,61,.12); border:1px solid rgba(255,211,61,.35);
    border-radius:10px; padding:8px; margin-bottom:10px;
    text-align:center; font-size:14px; color:#ffe08a; font-weight:bold;
  }
  #shopMsg { min-height:17px; text-align:center; font-size:12.5px; color:#ff9a9a; margin-bottom:6px; }
  #shopMsg.ok { color:#9effa0; }
  #shopPreview { display:block; width:100%; height:110px; margin:6px 0 10px;
    background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.06), rgba(0,0,0,.28));
    border-radius:12px; border:1px solid rgba(255,255,255,.08); }
  .shopRow {
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:10px 11px; margin-bottom:9px;
  }
  .shopRow.on { border-color:rgba(255,211,61,.5); background:rgba(255,211,61,.1); }
  .shopBird { width:34px; height:34px; border-radius:50%; flex:none; border:2px solid rgba(255,255,255,.75); }
  .shopInfo { flex:1; min-width:0; }
  .shopName { font-size:14px; font-weight:bold; color:#fff; }
  .shopSkill { font-size:11.5px; color:#9ec5ff; margin-top:3px; line-height:1.45; }
  .shopPrice { font-size:11.5px; color:#ffe08a; margin-top:3px; }
  .shopBtn {
    flex:none; padding:7px 10px; border:none; border-radius:9px;
    font-size:12.5px; font-weight:bold; cursor:pointer; white-space:nowrap;
  }
  .shopBtn.buy   { background:#ffd33d; color:#3a2c00; }
  .shopBtn.equip { background:#3a5fd9; color:#fff; }
  .shopBtn.cant  { background:rgba(255,255,255,.1); color:#ff9a9a; cursor:default; }
  .shopBtn.done  { background:rgba(255,255,255,.08); color:#9effa0; cursor:default; }
  .shopBtn:active:not(.cant):not(.done) { transform:translateY(2px); }
  .shopClose { width:100%; margin-top:4px; padding:10px; border:none; border-radius:10px;
    background:#3a3c66; color:#fff; font-size:14px; font-weight:bold; cursor:pointer; }
  .shopClose:active { transform:translateY(2px); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
</div>

<!-- 登录 / 注册浮层：未登录时盖在游戏上方，内分「登录视图」「注册视图」两层 -->
<div id="loginOverlay">
  <div class="loginCard">
    <!-- 登录视图 -->
    <div id="loginView">
      <div class="loginTitle">Boss Bird 登录</div>
      <input id="liUser" type="text" placeholder="用户名" autocomplete="username" maxlength="20">
      <input id="liPass" type="password" placeholder="密码" autocomplete="current-password" maxlength="30">
      <div id="liErr" class="liErr"></div>
      <button id="liLogin" class="liBtn liPrimary">登录</button>
      <button id="liToRegister" class="liBtn">注册新账号</button>
      <button id="liGuest" class="liGuest">游客试玩（不记录成绩）</button>
    </div>
    <!-- 注册视图（独立界面） -->
    <div id="registerView" style="display:none">
      <div class="loginTitle">注册新账号</div>
      <input id="rgUser" type="text" placeholder="用户名（2-20 位）" autocomplete="username" maxlength="20">
      <input id="rgPass" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password" maxlength="30">
      <input id="rgPass2" type="password" placeholder="确认密码" autocomplete="new-password" maxlength="30">
      <div id="rgErr" class="liErr"></div>
      <button id="rgRegister" class="liBtn liPrimary">确认注册</button>
      <button id="rgBack" class="liBtn">返回登录</button>
    </div>
  </div>
</div>

<!-- 好友浮层：我的好友码 + 输入好友码互加（排行榜拆到独立一页） -->
<div id="friendsOverlay">
  <div class="friendCard">
    <div class="fTitle">好友</div>
    <div class="fLabel">我的好友码（发给朋友即可互加）</div>
    <div class="fUidRow">
      <div id="fMyUid" class="fUid">——</div>
      <button id="fCopy" class="fCopy">复制</button>
    </div>
    <div class="fLabel">输入对方好友码添加</div>
    <div class="fAddRow">
      <input id="fInput" type="text" placeholder="如 BB-7F3K9X" maxlength="9" autocomplete="off" spellcheck="false">
      <button id="fAddBtn" class="fAddBtn">添加</button>
    </div>
    <div id="fMsg" class="fErr"></div>
    <button id="fRankBtn" class="fRankBtn">查看好友排行榜</button>
    <button id="fClose" class="fClose">关闭</button>
    <div class="fTip">互加好友无需对方同意，输入即双向成为好友</div>
  </div>
</div>

<!-- 排行榜浮层：独立一页，从好友面板点「查看好友排行榜」进入 -->
<div id="rankOverlay">
  <div class="rankCard">
    <div class="fTitle">好友排行榜</div>
    <div id="rankList" class="fList"><div class="fEmpty">加载中…</div></div>
    <button id="rankClose" class="fClose">返回</button>
  </div>
</div>

<!-- 技能图鉴浮层：列出全部皮肤及技能说明（点击「技能图鉴」按钮进入） -->
<div id="skillCodexOverlay">
  <div class="skillCard">
    <div class="skillTitle">技能图鉴</div>
    <div class="skillSub">全部角色皮肤及其技能说明</div>
    <div id="skillList"></div>
    <button id="skillClose" class="skillClose">关闭</button>
  </div>
</div>

<!-- 皮肤商店浮层：点底部「皮肤商店 ›」或点未拥有的皮肤进入 -->
<div id="shopOverlay">
  <div class="shopCard">
    <div class="shopTitle">皮肤总览</div>
    <div class="skillSub">用局内金币兑换角色，永久拥有</div>
    <div class="shopWallet">我的金币 <span id="shopCoins">0</span></div>
    <canvas id="shopPreview" width="240" height="110"></canvas>
    <div id="shopMsg"></div>
    <div id="shopList"></div>
    <button id="shopClose" class="shopClose">返回游戏</button>
  </div>
</div>

<script>
/* =========================================================
   Boss Bird —— 一个极简的「像素小鸟 / Flappy Bird」克隆
   全部逻辑都在这一个文件里，零依赖，双击即可运行。
   想改难度？往下看代码里的「可调参数」区块。
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;   // 画布宽 360
const H = canvas.height;  // 画布高 640

/* ---------- 崩溃诊断：把未捕获异常画到画布上，便于手机端定位 ---------- */
let lastError = null;

window.onerror = function(msg, url, line, col, err) {
  const stack = err && err.stack ? String(err.stack) : '';
  let ln = line, cl = col;
  if (!ln && stack) {                        // inline 脚本抛错时 line/col 可能为 0，从 stack 兜底解析
    const m = stack.match(/BossBird\.html:(\d+):(\d+)/);
    if (m) { ln = +m[1]; cl = +m[2]; }
  }
  lastError = { msg: String(msg), line: ln, col: cl, stack };
  console.error('[BossBird global error]', msg, 'line:', line, 'col:', col);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  lastError = { msg: 'Unhandled: ' + String(e.reason), line: 0, col: 0, stack: '' };
  console.error('[BossBird unhandledrejection]', e.reason);
});

function drawErrorScreen() {
  if (!lastError) return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.9)';
  ctx.fillRect(8, 8, W - 16, H - 16);
  ctx.fillStyle = '#ff5555';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const lines = [
    'CRASH: ' + lastError.msg,
    'Line: ' + lastError.line + '  Col: ' + lastError.col,
  ];
  if (lastError.stack) {
    const stackLines = lastError.stack.split('\n').map(s => s.trim()).filter(s => s).slice(0, 8);
    lines.push(...stackLines);
  }
  let y = 24;
  for (const line of lines) {
    ctx.fillText(line.slice(0, 220), 18, y);
    y += 17;
  }
  ctx.restore();
}

/* ---------- 可调参数（改这里就能调难度/手感）---------- */
const GRAVITY   = 0.43;   // 重力：越大下落越快
const FLAP      = -8;     // 拍翅膀的向上速度（负数=向上）
const PIPE_W    = 58;     // 管道宽度
const GAP       = 160;    // 上下管道之间的缝隙高度
const SPEED     = 2.2;    // 管道向左移动的速度
const SPAWN_EVERY = 95;   // 每隔多少帧生成一根新管道
const GROUND_H  = 60;     // 底部地面高度
const MIN_PIPE_SPACING = 160;  // 相邻管道最小水平间距（>PIPE_W，杜绝两管重合）
const MAX_GAP_Y_DELTA  = 150;  // 相邻管道缝隙中心最大垂直落差（杜绝"必死"之字形）
/* -------------------------------------------------------- */

/* ---------- 音效系统（Web Audio API 合成，零外部文件）---------- */
let audioCtx = null;
let muted = false;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// 播放一个指定频率、时长、波形、音量的纯音
function playTone(freq, dur, type, vol) {
  if (!audioCtx || muted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// 播放频率从 freq1 滑到 freq2 的音
function playSlide(freq1, freq2, dur, type, vol) {
  if (!audioCtx || muted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// 播放一段滤波白噪声（用于爆炸/击碎音效）
function playNoise(dur, vol, filterFreq) {
  if (!audioCtx || muted) return;
  const bs = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource(); noise.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = filterFreq || 800;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start(); noise.stop(audioCtx.currentTime + dur);
}

/* ---------- 背景音乐（Web Audio 程序化合成，无音频文件，轻快琶音循环）---------- */
// 和弦进行 C - Am - F - G（I-vi-IV-V），每个和弦 2 拍，循环 8 拍
const BGM_TONES = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392.00, A: 440.00, B: 493.88, C2: 523.25 };
const BGM_CHORDS = [
  ['C', 'E', 'G', 'C2'],  // C
  ['A', 'C', 'E', 'A'],   // Am
  ['F', 'A', 'C', 'F'],   // F
  ['G', 'B', 'D', 'G'],   // G
];
const BGM_BASS = { C: 130.81, A: 110.00, F: 87.31, G: 98.00 };  // 根音低八度
const BGM_BPM = 105;      // 速度
let bgmTimer = null;      // 调度定时器
let bgmStep = 0;          // 当前 8 分音符步数
let bgmNextT = 0;         // 下一个音符的调度时间

// 播放单个 BGM 音符（短包络，八音盒感）
function bgmTone(freq, t, dur, vol, type) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}

// 调度器：提前 0.3s 排好未来音符，保证循环无缝
function bgmSchedule() {
  if (!audioCtx || muted) return;
  const stepDur = 60 / BGM_BPM / 2;   // 一个 8 分音符时长
  while (bgmNextT < audioCtx.currentTime + 0.3) {
    const chordIdx = Math.floor(bgmStep / 8) % 4;   // 每 8 步换和弦
    const inChord = bgmStep % 8;
    const chord = BGM_CHORDS[chordIdx];
    // 琶音：每步弹一个和弦音，来回起伏
    const arp = chord[inChord % 4];
    bgmTone(BGM_TONES[arp], bgmNextT, stepDur * 0.9, 0.045, 'triangle');
    // 低音：每 2 步（一拍）弹一次根音
    if (inChord % 2 === 0) bgmTone(BGM_BASS[chord[0]], bgmNextT, stepDur * 1.8, 0.04, 'sine');
    bgmStep++;
    bgmNextT += stepDur;
  }
}

function startBGM() {
  if (!audioCtx || muted || bgmTimer) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  bgmStep = 0;
  bgmNextT = audioCtx.currentTime + 0.1;
  bgmTimer = setInterval(bgmSchedule, 100);
}

function stopBGM() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

/* ---------- 生成一根新管道 ---------- */
function spawnPipe() {
  // 间距守卫：上一根还没离开右边界足够距离就不生成，防止两管视觉/碰撞重合
  if (pipes.length) {
    let lastX = -Infinity;
    for (const p of pipes) if (p.x > lastX) lastX = p.x;
    if (lastX > W - MIN_PIPE_SPACING) return;
  }

  const margin = 60;
  const g = curGap();                          // 当前难度下的缝隙高度
  let gapY = margin + Math.random() * (H - margin * 2 - GROUND_H - g);

  // 限制与上一根管道缝隙的垂直落差，保证路径"走得通"：
  // 难度只来自缝隙变窄 / 提速 / 变密，而不是造出走不过去的必死布局
  if (pipes.length) {
    let prev = null, prevX = -Infinity;
    for (const p of pipes) if (p.x > prevX) { prevX = p.x; prev = p; }
    const prevCenter = prev.gapY + prev.gap / 2;
    const newCenter  = gapY + g / 2;
    const delta = newCenter - prevCenter;
    if (delta > MAX_GAP_Y_DELTA)       gapY -= (delta - MAX_GAP_Y_DELTA);
    else if (delta < -MAX_GAP_Y_DELTA) gapY += (-MAX_GAP_Y_DELTA - delta);
    gapY = Math.max(margin, Math.min(gapY, H - margin - GROUND_H - g));
  }

  const pipeX = W;
  // 检查金币：若有则把缝隙对准金币
  for (const c of coins) {
    if (c.x + c.r > pipeX && c.x - c.r < pipeX + PIPE_W) {
      const coinY = c.y + Math.sin(c.bob) * 4;
      if (coinY - c.r < gapY || coinY + c.r > gapY + g) {
        gapY = coinY - g / 2;
        gapY = Math.max(margin, Math.min(gapY, H - margin - GROUND_H - g));
      }
    }
  }
  // 检查果实：避免管道覆盖果实
  for (const f of fruits) {
    if (f.x + f.r > pipeX && f.x - f.r < pipeX + PIPE_W) {
      const fruitY = f.y + Math.sin(f.bob) * 4;
      if (fruitY - f.r < gapY || fruitY + f.r > gapY + g) {
        gapY = fruitY - g / 2;
        gapY = Math.max(margin, Math.min(gapY, H - margin - GROUND_H - g));
      }
    }
  }
  pipes.push({ x: pipeX, gapY: gapY, gap: g, passed: false });
}

/* ---------- 生成一枚金币（不会与任何管道实体重叠）---------- */
function spawnCoin() {
  const cx = W + 20;
  const cr = 11;
  // 找出 x 范围与金币重叠的管道，金币必须落在它们的缝隙内
  let gapPipe = null;
  for (const p of pipes) {
    if (cx + cr > p.x && cx - cr < p.x + PIPE_W) {
      if (gapPipe) return;   // 同时撞上两根管道（极罕见），放弃这枚
      gapPipe = p;
    }
  }
  let y;
  if (gapPipe) {
    // 金币 x 与某根管道重叠 -> 放在该管道缝隙内（留安全边距）
    const pad = cr + 6;
    const minY = gapPipe.gapY + pad;
    const maxY = gapPipe.gapY + gapPipe.gap - pad;
    if (maxY < minY) return;  // 缝隙太窄放不下，放弃
    y = minY + Math.random() * (maxY - minY);
  } else {
    // 没有管道挡着，随机高度
    y = 80 + Math.random() * (H - GROUND_H - 160);
  }
  coins.push({ x: cx, y: y, r: cr, spin: 0, eaten: false, bob: Math.random() * Math.PI * 2 });
}

/* ---------- 吃到金币时的金色火花特效 ---------- */
function spawnCoinSparkle(x, y) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 3 + 1;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      size: Math.random() * 3 + 1.5,
      color: Math.random() < 0.5 ? '#ffd700' : '#fff6c2',
    });
  }
}

/* ---------- 生成一颗技能果实（不会与管道实体重叠）---------- */
function spawnFruit() {
  const cx = W + 20;
  const cr = 13;
  // 随机选择果实类型：1=红橙(碎管), 2=蓝(护盾), 3=灰(减分缩小), 4=黑(双倍buff)
  let type;
  if (currentSkin === 4) type = 1;                              // 红鸟技能：只生成红色(红橙)果实
  else if (currentSkin === 6 && Math.random() < 0.30) type = 4; // 黑鸟技能：30% 概率刷黑色果实
  else type = 1 + Math.floor(Math.random() * 3);
  // 与金币相同的防重叠逻辑
  let gapPipe = null;
  for (const p of pipes) {
    if (cx + cr > p.x && cx - cr < p.x + PIPE_W) {
      if (gapPipe) return;   // 同时撞上两根管道（极罕见），放弃
      gapPipe = p;
    }
  }
  let y;
  if (gapPipe) {
    const pad = cr + 6;
    const minY = gapPipe.gapY + pad;
    const maxY = gapPipe.gapY + gapPipe.gap - pad;
    if (maxY < minY) return;
    y = minY + Math.random() * (maxY - minY);
  } else {
    y = 80 + Math.random() * (H - GROUND_H - 160);
  }
  fruits.push({ x: cx, y: y, r: cr, type: type, spin: 0, eaten: false, bob: Math.random() * Math.PI * 2 });
}

/* ---------- 吃到果实时的爆裂特效 ---------- */
function spawnFruitEffect(x, y, type) {
  let colors;
  if (type === 1) colors = ['#ff4500', '#ff8c00', '#ff6347'];
  else if (type === 2) colors = ['#4ec0ff', '#7ec8ff', '#2b8fd6'];
  else if (type === 4) colors = ['#000000', '#2a2a2a', '#555555'];
  else colors = ['#aaa', '#888', '#ccc'];
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 3.5 + 1;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      size: Math.random() * 3.5 + 2,
      color: colors[Math.floor(Math.random() * colors.length)],
    });
  }
}

/* ---------- 击碎管道的碎片爆炸特效 ---------- */
function spawnPipeCrushEffect(x, gapY, gap) {
  // 上管道碎片
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x + Math.random() * PIPE_W,
      y: Math.random() * gapY,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 4 - 1,
      life: 1,
      size: Math.random() * 4 + 2,
      color: Math.random() < 0.5 ? '#5cb85c' : '#4cae4c',
    });
  }
  // 下管道碎片
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x + Math.random() * PIPE_W,
      y: gapY + gap + Math.random() * (H - GROUND_H - gapY - gap),
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 4 - 1,
      life: 1,
      size: Math.random() * 4 + 2,
      color: Math.random() < 0.5 ? '#5cb85c' : '#4cae4c',
    });
  }
}

/* ---------- 应用果实效果 ---------- */
function applyFruitEffect(type, x, y) {
  spawnFruitEffect(x, y, type);
  sfxFruit(type);
  fruitsEaten++;

  const dbl = blackBuffTimer > 0;   // 黑鸟 buff 期间：效果翻倍

  if (type === 1) {
    // 红橙色：击碎前方管道 + 加分
    // 红鸟(id:4)技能削弱版：只碎1管+加1分，避免「只刷红橙=纯上坡」超模；
    // 普通鸟吃红橙仍维持碎3管+加3分的原强度
    const crushN   = (currentSkin === 4) ? 1 : 3;
    const addScore = (currentSkin === 4) ? 1 : 3;
    const ahead = pipes
      .filter(p => p.x + PIPE_W > bird.x - bird.r)
      .sort((a, b) => a.x - b.x);
    const toCrush = ahead.slice(0, crushN * (dbl ? 2 : 1));   // buff 期间碎管数翻倍
    for (const p of toCrush) {
      spawnPipeCrushEffect(p.x, p.gapY, p.gap);
      pipesCrushed++;
    }
    pipes = pipes.filter(p => !toCrush.includes(p));
    score += addScore * (dbl ? 2 : 1);   // buff 期间加分翻倍
    sfxCrush();
  } else if (type === 2) {
    // 蓝色护盾果：+1 护盾，体积增大一档
    // 黑鸟 buff 期间：护盾果不翻倍（仅红橙/金币效果翻倍）
    bird.shield += (currentSkin === 6 && dbl) ? 1 : (dbl ? 2 : 1);
    if (currentSkin === 2) {
      // 薄荷天生体积小：护盾球的体积增幅也较小（+1，上限收紧到 baseR+3）
      bird.r = Math.min(bird.r + (dbl ? 2 : 1), bird.baseR + 3);
    } else {
      bird.r = Math.min(bird.r + (dbl ? 4 : 2), bird.baseR + 6);
    }
  } else if (type === 4) {
    // 黑色：开启 6 秒「双倍 + 免疫减益」buff
    blackBuffTimer = 360;   // 360 帧 ≈ 6 秒（dt 已按 60fps 归一化）
  } else {
    // 灰色果实
    if (blackBuffTimer > 0) {
      // 黑鸟 buff 期间：免疫减益——灰色果实正常缩小体积，但不再扣分
      bird.r = Math.max(bird.r - 3, bird.baseR - 6);
    } else if (currentSkin === 5) {
      // 白鸟技能：吃灰果反转为增益——体积变小且 +1 分（不扣分）
      score += 1;
      bird.r = Math.max(bird.r - 3, bird.baseR - 6);
    } else {
      // 普通鸟：扣 2 分，鸟体积明显变小（体积范围 ±6，与蓝色护盾果对称）
      score = Math.max(0, score - 2);
      bird.r = Math.max(bird.r - 3, bird.baseR - 6);
    }
  }
}

/* ---------- 每帧更新逻辑 ---------- */
function update(dt) {
  if (dt === undefined) dt = 1;   // 兜底：无参数时按 60fps 一帧
  // 皮肤提示倒计时（按时间而非帧数，各刷新率下时长一致）
  if (unlockMsgTimer > 0) unlockMsgTimer -= dt;
  if (goldFlashTimer > 0) goldFlashTimer -= dt;
  if (blackBuffTimer > 0) blackBuffTimer -= dt;   // 黑鸟双倍 buff 倒计时（按时间，与刷新率无关）
  // 背景音乐：游戏中播放，其他状态停止（静音时自动停）
  if (state === 'playing' && !muted) startBGM(); else stopBGM();
  // 粒子始终更新（任何状态下都继续飘散、淡出）
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.05 * dt;     // 粒子也受一点重力
    p.life -= 0.04 * dt;   // 逐渐淡出
  }
  particles = particles.filter(p => p.life > 0);

  // 云朵漂移 + 尾部粒子生成（任何状态下都更新，让背景有生命力）
  for (const cl of clouds) {
    cl.x -= 0.3 * cl.s * dt;           // 缓慢向左飘
    if (cl.x < -60) cl.x = W + 50;      // 飘出左边后从右边回来
    cl.bobPhase = (cl.bobPhase || 0) + 0.02 * dt;
    // 随机在尾部（左侧）生成一团模糊粒子，模拟云尾消散
    if (Math.random() < 0.18 * dt) {
      cl.trail.push({
        x: cl.x - 24 * cl.s + (Math.random() - 0.5) * 10,
        y: cl.y + (Math.random() - 0.5) * 16 * cl.s + Math.sin(cl.bobPhase) * 3,
        vx: -0.3 - Math.random() * 0.4,
        vy: (Math.random() - 0.5) * 0.25,
        life: 1,
        size: Math.random() * 7 * cl.s + 4,
      });
    }
    // 更新云尾粒子
    for (const tp of cl.trail) {
      tp.x += tp.vx * dt;
      tp.y += tp.vy * dt;
      tp.life -= 0.012 * dt;
      tp.size *= Math.pow(0.99, dt);
    }
    cl.trail = cl.trail.filter(tp => tp.life > 0);
  }

  if (state === 'playing') {
    // 传送门彩蛋：累计本局帧数并判定触发 / 倒计时
    runFrames += dt;
    if (PORTAL_ENABLED && portalArmed && !inPortal && !portalFadingOut && runFrames >= portalAt) {
      enterPortal();
    }
    if (inPortal) {
      portalTimer -= dt;
      if (portalFade < 1) portalFade = Math.min(1, portalFade + 0.05 * dt);   // 淡入夜空
      if (portalTimer <= 0) { inPortal = false; portalFadingOut = true; }     // 时间到，开始淡出
    } else if (portalFadingOut) {
      portalFade -= 0.05 * dt;
      if (portalFade <= 0) { portalFade = 0; portalFadingOut = false; }
    }

    // 1. 小鸟受重力影响下落（乘 dt：高刷屏不会下坠更快）
    bird.vy += GRAVITY * dt;
    bird.y  += bird.vy * dt;
    if (bird.invuln > 0) bird.invuln -= dt;   // 无敌帧倒计时（按时间）

    // 2. 定时生成管道（夜空期间暂停生成，返回后恢复）
    if (!inPortal) {
      pipeSpawnTimer += dt;
      if (pipeSpawnTimer >= curSpawn()) {
        spawnPipe();
        pipeSpawnTimer = 0;
      }
    }

    // 3. 管道向左移动，并给穿过的管道计分
    const spd = curSpeed();
    for (const p of pipes) {
      p.x -= spd * dt;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        pipesPassedForShield++;               // 飞过的管道计数（击碎的不算）
        // 每跳过若干管道获得 1 层护盾：小蓝(id:1)每4管（已削弱），其他皮肤每5管
        const shieldEvery = currentSkin === 1 ? 4 : 5;
        if (pipesPassedForShield >= shieldEvery) {
          bird.shield++;
          pipesPassedForShield = 0;
        }
        sfxScore();
      }
    }
    // 4. 移除已经移出屏幕左侧的管道
    pipes = pipes.filter(p => p.x + PIPE_W > 0);

    // 7. 金币系统：随机间隔刷新，向左移动，碰到小鸟则吃掉 +1 分
    coinSpawnTimer += dt;
    if (coinSpawnTimer > 55 + Math.random() * 75) {   // 55~130 帧随机间隔（按时间）
      // 黄金神鸟局内金币数量保持正常，仅通过结算「技能增益」提升（见下方 recordScore）
      spawnCoin();
      coinSpawnTimer = 0;
    }
    for (const c of coins) {
      c.x -= spd * dt;
      c.spin += 0.12 * dt;                // 旋转动画
      c.bob += 0.05 * dt;                 // 上下浮动
      // 黄金神鸟皮肤技能：大范围磁吸金币（100px 内金币向小鸟靠拢，越近越快）
      if (currentSkin === 3 && !c.eaten) {
        const mx = bird.x - c.x;
        const my = bird.y - (c.y + Math.sin(c.bob) * 4);
        const md = Math.sqrt(mx * mx + my * my);
        if (md < 100 && md > 0.5) {
          const pull = (1 - md / 100) * 6 + 1.5;
          c.x += (mx / md) * pull * dt;
          c.y += (my / md) * pull * dt;
        }
      }
      // 碰撞检测：小鸟圆 vs 金币圆
      // 薄荷皮肤技能：拾取半径按正常体型(baseR)，不因体积小而缩小，金币一样好捡
      const coinPickR = (currentSkin === 2) ? bird.baseR : bird.r;
      if (!c.eaten) {
        const dx = bird.x - c.x;
        const dy = bird.y - (c.y + Math.sin(c.bob) * 4);
        if (dx * dx + dy * dy < (coinPickR + c.r) * (coinPickR + c.r)) {
          c.eaten = true;
          // 金币收益：黑鸟 buff 期间翻倍为 +2；黄金神鸟被动「暴击」15% 概率本次 x3 并触发金光
          let coinVal = (blackBuffTimer > 0) ? 2 : 1;
          if (currentSkin === 3 && Math.random() < 0.15) {
            coinVal *= 3;            // 暴击：本次吸到的金币 ×3
            goldFlashTimer = 16;     // 触发全屏金光（约 0.27 秒淡出）
          }
          score += coinVal;
          coinsEaten += coinVal;
          spawnCoinSparkle(c.x, c.y);
          sfxCoin();
        }
      }
    }
    coins = coins.filter(c => !c.eaten && c.x + c.r > 0);

    // 8. 技能果实系统：随机间隔刷新，向左移动，碰到小鸟则触发效果
    fruitSpawnTimer += dt;
    if (fruitSpawnTimer > 90 + Math.random() * 120) {   // 90~210 帧随机间隔（按时间）
      spawnFruit();
      fruitSpawnTimer = 0;
    }
    for (const f of fruits) {
      f.x -= spd * dt;
      f.spin += 0.1 * dt;                 // 脉冲动画
      f.bob += 0.05 * dt;                 // 上下浮动
      // 薄荷皮肤技能：拾取半径按正常体型，不因体积小而难捡果实
      const fruitPickR = (currentSkin === 2) ? bird.baseR : bird.r;
      if (!f.eaten) {
        const dx = bird.x - f.x;
        const dy = bird.y - (f.y + Math.sin(f.bob) * 4);
        if (dx * dx + dy * dy < (fruitPickR + f.r) * (fruitPickR + f.r)) {
          f.eaten = true;
          applyFruitEffect(f.type, f.x, f.y);   // 触发对应果实效果
        }
      }
    }
    fruits = fruits.filter(f => !f.eaten && f.x + f.r > 0);

    // 5. 碰撞检测
    if (bird.invuln <= 0) {
      // 飞到屏幕顶部：撞天花板不结算、不给 195 分，小鸟卡在顶部等重力拉回，游戏继续
      if (bird.y - bird.r < 0) {
        bird.y = bird.r;        // 停在天花板下方，不再往上飞
        bird.vy = 0;            // 速度归零，靠重力自然回落，不触发结算
      }
      // 撞到地面：直接死亡，不再消耗护盾（地面=绝对死亡线）
      else if (bird.y + bird.r > H - GROUND_H) {
        gameOver();              // 接触地面立即结束，护盾在此无效
        return;
      }
    }

    // 6. 碰撞检测：撞管道（无敌帧内忽略）
    let dead = false;
    for (const p of pipes) {
      const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
      if (inX) {
        const hitTop    = bird.y - bird.r < p.gapY;          // 撞上管道
        const hitBottom = bird.y + bird.r > p.gapY + p.gap;  // 撞下管道
        // 命中且在无敌帧外 -> 结算伤害；命中一根就跳出，避免重复判定
        if ((hitTop || hitBottom) && bird.invuln <= 0 && takeHit()) dead = true;
        break;
      }
    }
    if (dead) return;
  } else if (state === 'ready') {
    // 待机时小鸟轻轻上下浮动，提示「点我」
    bird.y = H / 2 + Math.sin(Date.now() / 200) * 6;
  }
}

function gameOver() {
  state = 'over';
  bird.hurt = true;
  inPortal = false; portalFadingOut = false; portalFade = 0;   // 清理传送门视觉，结束界面回到白天
  sfxDeath();
  if (score > best) {
    best = score;
    newRecord = true;
    localStorage.setItem((loggedIn && !isGuest) ? 'bossBirdBest_' + currentUser : 'bossBirdBest', best); // 最高分存本地，下次还在
  }
  // 黄金神鸟皮肤技能：结算时金币按「技能增益」50% 提升（吃 N 个记 ≈ N×1.5，温和不超标）
  const coinGain = (currentSkin === 3) ? Math.round(coinsEaten * 1.5) : coinsEaten;
  recordScore(score, coinGain);   // 记入历史并按本局吃到金币数结算总金币（最多保留最近 100 局）
}

/* ---------- 受伤结算：有护盾则消耗一层，否则死亡 ---------- */
function takeHit() {
  if (bird.shield > 0) {
    bird.shield--;            // 消耗一层护盾
    bird.invuln = 45;         // 短暂无敌，避免被同一根管子连续打死
    bird.vy = FLAP * 0.7;     // 向上弹开一点，争取脱困空间
    spawnShieldBreak();       // 护盾破碎特效
    sfxShield();
    return false;             // 没死
  }
  gameOver();
  return true;                // 死了
}

/* ---------- 绘制 ---------- */
/* ---------- 传送门夜空：有太阳但黑天，交叉淡入淡出覆盖在白天场景之上 ---------- */
function drawNightSky(alpha) {
  ctx.save();
  // 夜空渐变（深蓝紫 → 近黑）
  const ng = ctx.createLinearGradient(0, 0, 0, H);
  ng.addColorStop(0, '#0b1026');
  ng.addColorStop(0.6, '#1a1740');
  ng.addColorStop(1, '#241a4d');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);
  // 星星（固定位置点缀）
  ctx.fillStyle = '#ffffff';
  const stars = [[60,60],[140,40],[230,90],[330,50],[420,80],[510,45],[600,100],[90,140],[300,130],[470,150],[560,170],[180,185]];
  for (const s of stars) {
    ctx.globalAlpha = alpha * 0.8;
    ctx.beginPath();
    ctx.arc(s[0], s[1], 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // 苍白的太阳（夜空彩蛋的核心视觉）：外晕 + 本体
  const sx = W * 0.72, sy = H * 0.28, sr = 46;
  const halo = ctx.createRadialGradient(sx, sy, sr * 0.3, sx, sy, sr * 2.2);
  halo.addColorStop(0, 'rgba(255,236,170,0.55)');
  halo.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(sx, sy, sr * 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,245,210,0.95)';
  ctx.beginPath();
  ctx.arc(sx, sy, sr, 0, Math.PI * 2);
  ctx.fill();
  // 夜土地面（让"掉地仍死"在视觉上有落点）
  ctx.fillStyle = '#1c1530';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#2e2350';
  ctx.fillRect(0, H - GROUND_H, W, 14);
  ctx.restore();
}

function draw() {
  // 天空渐变背景（随难度从白天渐变到夜晚）
  const skyIdx = getDifficulty();
  const sg = ctx.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, SKY_GRADIENTS[skyIdx][0]);
  sg.addColorStop(1, SKY_GRADIENTS[skyIdx][1]);
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H);

  // 云朵（立体渐变 + 粒子尾迹）
  for (const cl of clouds) drawCloud3D(cl);

  // 管道
  for (const p of pipes) drawPipe(p);

  // 地面
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#5ee270';
  ctx.fillRect(0, H - GROUND_H, W, 14);

  // 传送门夜空场景（交叉淡入淡出；无管道、金币道具照常产出）
  if (portalFade > 0) drawNightSky(portalFade);

  // 金币
  for (const c of coins) drawCoin(c);

  // 技能果实
  for (const f of fruits) drawFruit(f);

  // 粒子（画在鸟后面，受击/起飞特效）
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 小鸟
  drawBird();

  // 进行中：中央显示分数 + 难度等级
  if (state === 'playing') {
    drawText(score, W / 2, 90, 'bold 42px sans-serif', '#fff', 'center');
    // 难度等级（分数下方小字，Lv.0 时不显示）
    const d = getDifficulty();
    if (d > 0) drawText('Lv.' + d, W / 2, 118, 'bold 14px sans-serif', 'rgba(255,255,255,0.7)', 'center');
    // 传送门彩蛋提示 + 倒计时（夜空期间）
    if (inPortal) {
      drawText('传送门 · 夜空彩蛋', W / 2, 150, 'bold 18px sans-serif', 'rgba(255,230,150,0.95)', 'center');
      drawText('剩余 ' + Math.ceil(portalTimer / 60) + 's', W / 2, 174, 'bold 15px sans-serif', 'rgba(255,255,255,0.85)', 'center');
    }
  }

  // 护盾层数（左上角，仅游戏进行中显示；待机/结算界面不残留）
  if (state === 'playing' && bird.shield > 0) drawShieldHUD(bird.shield);

  // 黑鸟双倍 buff 计时（左上角，仅游戏进行中显示）
  if (state === 'playing' && blackBuffTimer > 0) drawBlackBuffHUD();

  // 护盾进度条（盾图标下方，显示距下次护盾还差几根管道）
  if (state === 'playing' && pipesPassedForShield > 0) {
    const bx = 12, by = 52, bw = 28, bh = 4;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#5ad1ff';
    const shieldEveryHud = currentSkin === 1 ? 4 : 5;
    ctx.fillRect(bx, by, bw * (pipesPassedForShield / shieldEveryHud), bh);
  }

  // 黄金神鸟暴击金光（全屏金色闪光，极短）
  if (goldFlashTimer > 0) {
    const ga = Math.min(1, goldFlashTimer / 16) * 0.5;
    ctx.fillStyle = 'rgba(255, 215, 0, ' + ga + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // 待机界面
  if (state === 'ready') {
    drawText('Boss Bird', W / 2, 48, 'bold 40px sans-serif', '#fff', 'center');
    const who = loggedIn ? (isGuest ? '游客' : currentUser) : '';
    drawText('最高分  ' + best + (who ? '  ·  ' + who : '') + '  ·  金币 ' + walletCoins, W / 2, 74, '15px sans-serif', '#ffe9a8', 'center');
    if (loggedIn) { drawHistoryPanel(); drawLogoutBtn(); if (!isGuest) drawFriendsBtn(); }   // 已登录：显示最近20局 + 退出 + 好友
    drawFruitGuide(loggedIn ? 376 : 195);
    // 起飞提示（闪烁效果吸引注意）
    if (Math.floor(Date.now() / 500) % 2) {
      drawText('点击屏幕 / 空格 起飞', W / 2, H - 135, 'bold 17px sans-serif', '#fff', 'center');
    }
    // 待机界面也提示试玩次数用尽等信息（原仅结束界面有）
    if (unlockMsgTimer > 0) drawText(unlockMsg, W / 2, 112, 'bold 16px sans-serif', '#ff9a9a', 'center');
  }

  // 结束界面
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, W, H);
    // 新纪录标记
    if (newRecord) {
      drawText('★ 新纪录 ★', W / 2, H / 2 - 145, 'bold 22px sans-serif', '#ffe08a', 'center');
    }
    // 解锁新皮肤恭喜提示（倒计时在 update 中按时间递减）
    if (unlockMsgTimer > 0) {
      drawText(unlockMsg, W / 2, H / 2 - 115, 'bold 16px sans-serif', '#ffe08a', 'center');
    }
    drawText('游戏结束', W / 2, H / 2 - 75, 'bold 34px sans-serif', '#fff', 'center');
    drawText('本局得分  ' + score, W / 2, H / 2 - 30, 'bold 24px sans-serif', '#fff', 'center');
    drawText('历史最高  ' + best, W / 2, H / 2, '16px sans-serif', '#ffe9a8', 'center');
    // 统计面板
    const py = H / 2 + 28;
    drawText('金币 ' + coinsEaten + '  ·  碎管 ' + pipesCrushed + '  ·  果实 ' + fruitsEaten, W / 2, py, '14px sans-serif', '#ccc', 'center');
    drawText('难度等级  ' + getDifficulty(), W / 2, py + 22, '13px sans-serif', '#aaa', 'center');
    drawText('本局金币 +' + lastGain + '  ·  总金币 ' + walletCoins + (isGuest ? '（试玩，不保存）' : ''), W / 2, py + 46, 'bold 15px sans-serif', '#ffe08a', 'center');
    // 调侃文案
    if (score < 10) {
      drawText('要不出去洗把脸？', W / 2, py + 72, 'bold 17px sans-serif', '#ff9aa2', 'center');
    } else if (score < 100) {
      drawText('也就一般', W / 2, py + 72, 'bold 17px sans-serif', '#9ec5ff', 'center');
    } else {
      drawText('神了！', W / 2, py + 72, 'bold 23px sans-serif', 'rgb(255, 141, 1)', 'center');
    }
    // 重启提示（闪烁）
    if (Math.floor(Date.now() / 500) % 2) {
      drawText('点击重新开始', W / 2, py + 100, '16px sans-serif', '#fff', 'center');
    }
  }

  // 技能图鉴按钮（待机 / 结束界面左上角，点击打开图鉴）
  // 皮肤商店按钮（待机 / 结束界面左下角，点击打开商店）
  if (state === 'ready' || state === 'over') { drawSkillCodexBtn(); drawShopBtn(); }

  // 静音图标（右上角，所有界面都显示）
  drawMuteIcon();

  // 若主循环抛异常，把错误信息直接画到画布上（手机端没有 Console）
  drawErrorScreen();
}

/* ---------- 立体云朵：底部阴影 + 径向渐变主体 + 顶部高光 + 尾部粒子 ---------- */
function drawCloud3D(cl) {
  const x = cl.x, y = cl.y + Math.sin(cl.bobPhase || 0) * 3, s = cl.s;

  // 1. 尾部粒子拖尾（画在云体后面，从左向后消散）
  for (const tp of cl.trail) {
    ctx.globalAlpha = tp.life * 0.45;
    const tgrd = ctx.createRadialGradient(tp.x, tp.y, 0, tp.x, tp.y, tp.size);
    tgrd.addColorStop(0, 'rgba(255,255,255,0.7)');
    tgrd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = tgrd;
    ctx.beginPath();
    ctx.arc(tp.x, tp.y, tp.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 2. 底部阴影层（让云有"落在空中"的立体感）
  ctx.fillStyle = 'rgba(180,195,210,0.35)';
  ctx.beginPath();
  ctx.arc(x, y + 7 * s, 20 * s, 0, Math.PI * 2);
  ctx.arc(x + 22 * s, y + 11 * s, 15 * s, 0, Math.PI * 2);
  ctx.arc(x - 22 * s, y + 11 * s, 15 * s, 0, Math.PI * 2);
  ctx.arc(x + 8 * s, y + 14 * s, 12 * s, 0, Math.PI * 2);
  ctx.fill();

  // 3. 主体：径向渐变（左上亮 → 右下暗，模拟光照）
  const grd = ctx.createRadialGradient(x - 6 * s, y - 8 * s, 4, x + 4 * s, y + 4 * s, 28 * s);
  grd.addColorStop(0, 'rgba(255,255,255,0.98)');
  grd.addColorStop(0.5, 'rgba(248,250,252,0.85)');
  grd.addColorStop(1, 'rgba(210,222,235,0.55)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 22 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
  ctx.arc(x - 22 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
  ctx.arc(x + 10 * s, y - 8 * s, 12 * s, 0, Math.PI * 2);
  ctx.arc(x - 10 * s, y - 6 * s, 11 * s, 0, Math.PI * 2);
  ctx.fill();

  // 4. 顶部高光（最亮的小圆，模拟阳光照射点）
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(x - 6 * s, y - 9 * s, 7 * s, 0, Math.PI * 2);
  ctx.fill();
}

/* ---------- 金币：旋转椭圆 + 金色渐变 + 光泽 + 外圈发光 ---------- */
function drawCoin(c) {
  const cy = c.y + Math.sin(c.bob) * 4;
  // spin 控制宽度缩放，模拟硬币翻转
  const w = Math.abs(Math.cos(c.spin)) * c.r + 2;

  // 外圈发光
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 12;

  // 金色径向渐变主体
  const grd = ctx.createLinearGradient(c.x - w, cy - c.r, c.x + w, cy + c.r);
  grd.addColorStop(0, '#fff6c2');
  grd.addColorStop(0.4, '#ffd700');
  grd.addColorStop(1, '#daa520');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.ellipse(c.x, cy, w, c.r, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // 边框
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 中心 ¥ 符号（宽度够大时才画，避免翻转到极窄时糊成一团）
  if (w > c.r * 0.5) {
    ctx.fillStyle = '#b8860b';
    ctx.font = 'bold ' + Math.round(c.r * 1.1) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('¥', c.x, cy + 1);
  }

  // 高光弧（上方亮线，增加金属质感）
  if (w > c.r * 0.4) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(c.x - w * 0.2, cy - c.r * 0.3, w * 0.5, c.r * 0.4, -0.3, 0, Math.PI);
    ctx.stroke();
  }
}

/* ---------- 绘制技能果实：脉冲圆 + 径向渐变 + 发光 + 小叶子 + 符号 ---------- */
function drawFruit(f) {
  const cy = f.y + Math.sin(f.bob) * 4;
  // 脉冲效果：半径随时间微小波动，区别于金币的翻转
  const pulse = 1 + Math.sin(f.spin * 2) * 0.12;
  const r = f.r * pulse;

  // 按类型设定颜色
  let c1, c2, c3, glow, symbol;
  if (f.type === 1) {
    // 红橙色：击碎管道
    c1 = '#ff8c00'; c2 = '#ff4500'; c3 = '#cc3700';
    glow = '#ff5500'; symbol = '\u788E';   // 碎
  } else if (f.type === 2) {
    // 蓝色：护盾
    c1 = '#7ec8ff'; c2 = '#4ec0ff'; c3 = '#1a6ec4';
    glow = '#4ec0ff'; symbol = '\u76FE';   // 盾
  } else if (f.type === 4) {
    // 黑色：双倍增益
    c1 = '#3a3a3a'; c2 = '#161616'; c3 = '#000000';
    glow = '#b06bff'; symbol = '\u00D7 2';   // ×2
  } else {
    // 灰色：减分缩小
    c1 = '#d0d0d0'; c2 = '#999999'; c3 = '#555555';
    glow = '#888888'; symbol = '\u7F29';   // 缩
  }

  // 外圈发光
  ctx.shadowColor = glow;
  ctx.shadowBlur = 14;

  // 主体：径向渐变（左上亮 -> 右下暗）
  const grd = ctx.createRadialGradient(f.x - r * 0.3, cy - r * 0.3, 2, f.x, cy, r);
  grd.addColorStop(0, c1);
  grd.addColorStop(0.6, c2);
  grd.addColorStop(1, c3);
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(f.x, cy, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  // 边框
  ctx.strokeStyle = c3;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // 小叶子（顶部，让它看起来像果实）
  ctx.fillStyle = '#4caf50';
  ctx.beginPath();
  ctx.ellipse(f.x + 2, cy - r - 2, 4.5, 2.2, -0.5, 0, Math.PI * 2);
  ctx.fill();

  // 中心符号
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + Math.round(r * 0.75) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(symbol, f.x, cy + 1);

  // 高光点（左上方，增加立体感）
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(f.x - r * 0.35, cy - r * 0.35, r * 0.28, r * 0.18, -0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawPipe(p) {
  const topH = p.gapY;               // 上管道高度
  const bottomY = p.gapY + p.gap;    // 下管道起点
  ctx.fillStyle = '#5cb85c';
  ctx.fillRect(p.x, 0, PIPE_W, topH);
  ctx.fillRect(p.x, bottomY, PIPE_W, H - GROUND_H - bottomY);
  // 管口加粗
  ctx.fillStyle = '#4cae4c';
  ctx.fillRect(p.x - 3, topH - 16, PIPE_W + 6, 16);
  ctx.fillRect(p.x - 3, bottomY, PIPE_W + 6, 16);
}

function bodyFill() {
  let skinIdx = currentSkin;
  if (typeof skinIdx !== 'number' || isNaN(skinIdx) || skinIdx < 0 || skinIdx >= SKINS.length) skinIdx = 0;
  const s = SKINS[skinIdx];
  if (s.body) return s.body;                 // 普通纯色皮肤
  // 黄金神鸟：金色径向渐变
  const grd = ctx.createRadialGradient(-3, -3, 2, 0, 0, bird.r + 4);
  grd.addColorStop(0, '#fff6c2');
  grd.addColorStop(0.5, '#ffd700');
  grd.addColorStop(1, '#d4880a');
  return grd;
}

// 皇冠（仅黄金神鸟）
function drawCrown() {
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 1;
  const y = -bird.r - 7;
  ctx.beginPath();
  ctx.moveTo(-9, y + 7);
  ctx.lineTo(-9, y + 1);
  ctx.lineTo(-4.5, y + 5);
  ctx.lineTo(0, y);
  ctx.lineTo(4.5, y + 5);
  ctx.lineTo(9, y + 1);
  ctx.lineTo(9, y + 7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawBird() {
  // 防御：皮肤索引异常时回退到默认皮肤，避免整帧崩溃
  let skinIdx = currentSkin;
  if (typeof skinIdx !== 'number' || isNaN(skinIdx) || skinIdx < 0 || skinIdx >= SKINS.length) {
    skinIdx = 0;
  }
  const s = SKINS[skinIdx];
  ctx.save();
  ctx.translate(bird.x, bird.y);
  // 飞行时根据下落速度让小鸟微微低头/抬头
  let angle = 0;
  if (state === 'playing') angle = Math.max(-0.4, Math.min(1.2, bird.vy * 0.05));
  ctx.rotate(angle);

  // 无敌帧内闪烁，提示刚被护盾救了一命
  if (bird.invuln > 0) ctx.globalAlpha = (Math.floor(Date.now() / 80) % 2) ? 0.35 : 1;

  // 黄金神鸟：身体发光
  if (s.glow) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 18; }

  // 身体（按皮肤上色，黄金款为金色渐变）
  ctx.fillStyle = bodyFill();
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();
  if (s.id === 5) { ctx.strokeStyle = '#b9b9c8'; ctx.lineWidth = 1.5; ctx.stroke(); }   // 白鸟描边
  else if (s.id === 6) { ctx.strokeStyle = '#7a6a9a'; ctx.lineWidth = 1.5; ctx.stroke(); }  // 黑鸟描边（紫调，保证在天空/夜空中可见）
  ctx.shadowBlur = 0;   // 关掉阴影，避免影响后续绘制

  // 翅膀（按皮肤上色）
  ctx.fillStyle = s.wing;
  ctx.beginPath();
  ctx.ellipse(-4, 2, 8, 5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // 皇冠（仅黄金神鸟）
  if (s.crown) drawCrown();

  // 表情：受击时画 X 眼 + 张口，平时画圆眼 + 嘴（嘴色随皮肤）
  if (bird.hurt) {
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    // 左眼 X
    ctx.beginPath();
    ctx.moveTo(2, -7);  ctx.lineTo(8, -1);
    ctx.moveTo(8, -7);  ctx.lineTo(2, -1);
    // 右眼 X
    ctx.moveTo(9, -7);  ctx.lineTo(15, -1);
    ctx.moveTo(15, -7); ctx.lineTo(9, -1);
    ctx.stroke();
    // 受惊的张口（深色 O）
    ctx.fillStyle = '#7a1f1f';
    ctx.beginPath();
    ctx.ellipse(bird.r - 2, 3, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // 正常：圆眼
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(7.5, -4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    // 嘴（颜色随皮肤）
    ctx.fillStyle = s.beak;
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, -2);
    ctx.lineTo(bird.r + 8, -2);
    ctx.lineTo(bird.r - 2, 4);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

// 文本绘制小帮手
function drawText(t, x, y, font, color, align) {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}

// 左上角护盾显示：盾牌图标 + 层数
function drawShieldHUD(count) {
  const x = 26, y = 32;
  ctx.fillStyle = '#5ad1ff';
  ctx.beginPath();
  ctx.moveTo(x, y - 15);
  ctx.lineTo(x + 14, y - 9);
  ctx.lineTo(x + 14, y + 4);
  ctx.lineTo(x, y + 17);
  ctx.lineTo(x - 14, y + 4);
  ctx.lineTo(x - 14, y - 9);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  drawText('×' + count, x, y + 1, 'bold 15px sans-serif', '#063a55', 'center');
}

// 黑鸟双倍 buff 计时 HUD（左上角，紫色圆 + 剩余秒数）
function drawBlackBuffHUD() {
  const x = 26, y = 78;
  ctx.fillStyle = '#b06bff';
  ctx.beginPath();
  ctx.arc(x, y, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  const secs = Math.max(1, Math.ceil(blackBuffTimer / 60));
  drawText('×2', x, y + 1, 'bold 14px sans-serif', '#fff', 'center');
  drawText(secs + 's', x, y + 22, 'bold 10px sans-serif', 'rgba(255,255,255,0.85)', 'center');
}




/* ---------- 果实图鉴（开始界面展示3种果实效果）---------- *//* ---------- 果实图鉴（开始界面展示3种果实效果）---------- */
function drawFruitGuide(sy) {
  const cx = W / 2;
  const startY = sy || 195;
  const items = [
    { c1: '#ff8c00', c2: '#ff4500', glow: '#ff5500', symbol: '\u788E', text: '\u51FB\u788E\u524D\u65B93\u7BA1\u9053  +3\u5206' },
    { c1: '#7ec8ff', c2: '#4ec0ff', glow: '#4ec0ff', symbol: '\u76FE', text: '\u62A4\u76FE +1  \u9E1F\u53D8\u5927' },
    { c1: '#d0d0d0', c2: '#999999', glow: '#888888', symbol: '\u7F29', text: '\u5206\u6570 -2  \u9E1F\u53D8\u5C0F' },
  ];
  drawText('\u9053\u5177\u56FE\u9274', cx, startY - 22, 'bold 15px sans-serif', '#fff', 'center');
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const y = startY + i * 34;
    const fx = cx - 95;
    // 小果实圆
    ctx.shadowColor = it.glow;
    ctx.shadowBlur = 10;
    const grd = ctx.createRadialGradient(fx - 3, y - 3, 1, fx, y, 12);
    grd.addColorStop(0, it.c1);
    grd.addColorStop(0.6, it.c2);
    grd.addColorStop(1, it.c2);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(fx, y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 符号
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.symbol, fx, y + 1);
    // 效果说明
    drawText(it.text, cx + 10, y, '14px sans-serif', '#fff', 'left');
  }
}

/* ---------- 静音图标（右上角，所有界面都显示，可点击切换）---------- */
function drawMuteIcon() {
  const x = W - 28, y = 28;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI * 2);
  ctx.fill();
  // 喇叭主体
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 3);
  ctx.lineTo(x - 1, y - 3);
  ctx.lineTo(x + 3, y - 7);
  ctx.lineTo(x + 3, y + 7);
  ctx.lineTo(x - 1, y + 3);
  ctx.lineTo(x - 5, y + 3);
  ctx.closePath();
  ctx.fill();
  if (muted) {
    // 红色斜杠表示静音
    ctx.strokeStyle = '#ff5555';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x - 9, y - 9);
    ctx.lineTo(x + 9, y + 9);
    ctx.stroke();
  } else {
    // 声波弧线
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x + 5, y, 4, -0.6, 0.6);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + 5, y, 7, -0.5, 0.5);
    ctx.stroke();
  }
}

let history = [];

// 分页状态：每页条数、当前页、总条数、总页数、翻页按钮命中框
const HIST_PAGE_SIZE = 10;
let histPage = 1;
let histTotal = 0;
let histTotalPages = 1;
let histLoading = false;   // 翻页请求进行中：用于防抖 + 加载提示
let histHit = [];
// 已看页内存缓存：键=页码 → 该页完整快照（history/分页/最高分）。翻回看过的页直接命中，不再发请求，省掉 1.2s 物理延迟。
let pageCache = {};

// ── localStorage 历史记录兜底（PWA / 无后端环境） ──
function _lsHistKey() { return 'bossBirdHist_' + (currentUser || '_guest'); }
function _loadHistLS() {
  try { const r = localStorage.getItem(_lsHistKey()); return r ? JSON.parse(r) : []; }
  catch { return []; }
}
function _saveHistLS(arr) {
  try { localStorage.setItem(_lsHistKey(), JSON.stringify(arr.slice(0, 1000))); }  // 离线兜底上限扩到 1000 条
  catch {}
}

// 从后端分页拉取当前用户历史，并刷新最高分
// 后端不可用时自动降级到 localStorage（PWA 离线/纯前端模式）
async function fetchHistory(page = 1, force = false) {
  if (isGuest || !token) { history = []; histPage = 1; histTotal = 0; histTotalPages = 1; histLoading = false; pageCache = {}; return; }
  // ── 已看页缓存命中：直接恢复快照，不发请求（省掉 1.2s 物理延迟） ──
  if (!force && pageCache[page]) {
    const c = pageCache[page];
    history = c.history.slice(); histPage = c.page; histTotal = c.total;
    histTotalPages = c.totalPages; currentUser = c.username; best = c.best;
    histLoading = false;
    return;
  }
  histLoading = true;   // 加锁：翻页 / 校正请求进行中
  try {
    const r = await fetch('/api/scores?page=' + page + '&page_size=' + HIST_PAGE_SIZE, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) throw new Error('unauthorized');
    const j = await r.json();
    history = (j.history || []).map(h => ({ s: h.score, t: new Date(h.played_at).getTime() }));
    histPage = j.page || 1;
    histTotal = j.total || 0;
    histTotalPages = j.total_pages || 1;
    currentUser = j.username || currentUser;
    best = j.best || 0;
    walletCoins = (j.coins != null) ? j.coins : walletCoins;          // 从后端载入总金币
    ownedSkins = new Set(((j.owned_skins || '0').split(',')).map(Number).filter(id => Number.isFinite(id)));  // 载入已拥有皮肤（过滤 NaN）
    _saveHistLS(history); // 后端成功时同步一份到 localStorage，供离线兜底
    // 缓存本页完整快照（数组拷贝，避免与 history 共享引用被后续乐观更新污染），翻回时整体恢复
    pageCache[page] = { history: history.slice(), total: histTotal, totalPages: histTotalPages, username: currentUser, best, page: histPage };
  } catch (e) {
    // ── 无后端 / PWA 离线：从 localStorage 兜底 ──
    const all = _loadHistLS();
    histTotal = all.length;
    histTotalPages = Math.max(1, Math.ceil(all.length / HIST_PAGE_SIZE));
    histPage = Math.min(page, histTotalPages);
    const start = (histPage - 1) * HIST_PAGE_SIZE;
    history = all.slice(start, start + HIST_PAGE_SIZE);
    // 兜底模式下也要恢复 best（从 localStorage 或当前历史算）
    if (!best) {
      const savedBest = localStorage.getItem((loggedIn && !isGuest) ? 'bossBirdBest_' + currentUser : 'bossBirdBest');
      best = savedBest ? Number(savedBest) : 0;
    }
  } finally {
    histLoading = false;  // 解锁
  }
}

// 载入历史供渲染（drawHistoryPanel 用，返回 [{s, t}]）

}

// 记录一局成绩：优先写入后端，后端不可用时降级到 localStorage
async function recordScore(s, coinsEatenThisRun) {
  // 游客：不写后端，但在本次会话内正常结算（最高分、历史、金币都算），
  // 避免"金币 7 / 本局 +0"的自相矛盾；刷新或退出即清空，不落盘。
  if (isGuest) {
    const g = coinsEatenThisRun || 0;
    walletCoins += g;
    lastGain = g;
    if (s > best) best = s;
    history.unshift({ s: s, t: Date.now() });
    if (history.length > HIST_PAGE_SIZE) history.length = HIST_PAGE_SIZE; // 游客只留最近一页，不做翻页
    histPage = 1; histTotal = history.length; histTotalPages = 1;
    return;
  }
  if (!token) return;
  // ── 乐观更新：发请求前就让本局立刻出现在界面，彻底消除"慢半拍" ──
  const optimistic = { s: s, t: Date.now(), _opt: true };
  history.unshift(optimistic);
  if (s > best) best = s;
  // 本局金币乐观累加（按实际吃到的金币道具数量），结束界面即时可见
  const gain = coinsEatenThisRun || 0;
  walletCoins += gain;
  lastGain = gain;
  let serverOk = false;
  try {
    const r = await fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ score: s, coins: coinsEatenThisRun || 0 })
    });
    serverOk = r.ok;
    if (r.ok) {
      const j = await r.json();
      // 服务端权威校正（处理并发 / 取整边界）
      walletCoins = j.coins;
      lastGain = j.gain;
    }
  } catch (e) {}
  if (!serverOk) {
    // POST 失败：回滚乐观项与金币，回落到 localStorage 兜底（离线/后端不可达场景）
    history = history.filter(it => it !== optimistic);
    walletCoins -= gain;
    const all = _loadHistLS();
    all.unshift({ s: s, t: Date.now() }); // 最新在前
    _saveHistLS(all);
    best = Math.max(0, ...all.map(it => it.s));
  }
  pageCache = {};          // 新成绩会改变分页顺序，清空缓存（下次浏览各页重新拉取，保证准确）
  await fetchHistory(1, true);   // 后端校正（强制刷新第 1 页，含刚提交的这局）
}
// 登录成功后调用：保存 token，拉取历史，隐藏浮层
async function loginAs(user, tok, guest) {
  currentUser = user; isGuest = !!guest; loggedIn = true;
  if (!isGuest) {
    token = tok || token;
    localStorage.setItem('bossBirdToken', token);
    pageCache = {};        // 登录/切换用户：清空上一用户的页缓存
    await fetchHistory(1, true);
    let savedSkin = Number(localStorage.getItem('bossBirdSkin_' + user) || 0);
    if (!Number.isFinite(savedSkin) || savedSkin < 0 || savedSkin >= SKINS.length || !ownedSkins.has(savedSkin)) {
      savedSkin = 0;
    }
    currentSkin = savedSkin;
  } else {
    // 游客无持久账号：清空上一用户的钱包，避免继承其金币；
    // 但试玩模式全皮肤解锁，让游客能体验每个皮肤的技能（数据不落盘，退出即清）
    walletCoins = 0; lastGain = 0;
    ownedSkins = new Set(SKINS.map(s => s.id));
    guestSkinTrials = 0;   // 游客每次登录重置试玩次数（共 3 次）
    best = 0; history = []; histPage = 1; histTotal = 0; histTotalPages = 1;
    currentSkin = 0;   // 游客每次登录固定从「小黄鸟」(id:0) 开始，方便体验一次其他皮肤；不再读上次保存的 bossBirdSkin
  }
  loginOverlay.style.display = 'none';
  showLoginView();   // 复位到登录视图，避免下次进来停在注册页
}

// 圆角矩形小帮手
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 最近 20 局成绩面板（ready 界面，双列显示）
// 个位数补零（时分秒显示 05 而不是 5）
function pad2(n) { return (n < 10 ? '0' : '') + n; }

function drawHistoryPanel() {
  const arr = loadHistory();   // 当前页的历史记录（每帧重新读，保证实时）
  if (isGuest) {
    drawText('游客模式 · 成绩不记录', W / 2, 150, '14px sans-serif', '#aaa', 'center');
    return;
  }
  histHit = [];   // 每帧重算翻页按钮命中框
  const top = 112;
  drawText('历史成绩 · 共 ' + histTotal + ' 局', W / 2, top - 20, 'bold 15px sans-serif', '#ffe08a', 'center');
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  roundRect(14, top - 6, W - 28, 246, 10); ctx.fill();

  // 每页 HIST_PAGE_SIZE 条，排成 2 列 × 5 行
  const rowH = 22;
  const rowsPerCol = 5;
  for (let i = 0; i < HIST_PAGE_SIZE; i++) {
    const col = i < rowsPerCol ? 0 : 1;
    const idx = col === 0 ? i : i - rowsPerCol;
    const x = col === 0 ? 26 : 190;
    const y = top + idx * rowH + 12;
    if (i < arr.length) {
      const d = new Date(arr[i].t);
      const ds = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
      drawText('#' + (i + 1), x, y, '12px sans-serif', '#9ec5ff', 'left');
      drawText(String(arr[i].s), x + 34, y, 'bold 13px sans-serif', '#fff', 'left');
      drawText(ds, x + 62, y, '9px sans-serif', '#aaa', 'left');
    } else {
      drawText('#' + (i + 1) + ' -', x, y, '12px sans-serif', 'rgba(255,255,255,0.3)', 'left');
    }
  }

  // 分页控制：上一页 / 页码 / 下一页
  const py = top + rowsPerCol * rowH + 34;   // 5 行下方
  const btnR = 15;
  const canPrev = histPage > 1;
  const canNext = histPage < histTotalPages;

  // 上一页
  const prevX = 60;
  ctx.beginPath(); ctx.arc(prevX, py, btnR, 0, Math.PI * 2);
  ctx.fillStyle = canPrev ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)';
  ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = canPrev ? '#fff' : 'rgba(255,255,255,0.3)'; ctx.stroke();
  drawText('◀', prevX, py + 1, '13px sans-serif', canPrev ? '#fff' : 'rgba(255,255,255,0.3)', 'center');
  if (canPrev) histHit.push({ x: prevX, y: py, r: btnR, kind: 'prev' });

  // 下一页
  const nextX = W - 60;
  ctx.beginPath(); ctx.arc(nextX, py, btnR, 0, Math.PI * 2);
  ctx.fillStyle = canNext ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.08)';
  ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = canNext ? '#fff' : 'rgba(255,255,255,0.3)'; ctx.stroke();
  drawText('▶', nextX, py + 1, '13px sans-serif', canNext ? '#fff' : 'rgba(255,255,255,0.3)', 'center');
  if (canNext) histHit.push({ x: nextX, y: py, r: btnR, kind: 'next' });

  // 页码
  drawText('第 ' + histPage + ' / ' + histTotalPages + ' 页' + (histLoading ? ' · 加载中…' : ''), W / 2, py + 1, '13px sans-serif', '#ffe08a', 'center');
}

  ctx.fillStyle = g;
  roundRect(x, y, w, h, 12); ctx.fill();
  ctx.shadowBlur = 0;
  // 金色描边
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = 'rgba(255, 209, 102, .92)';
  roundRect(x, y, w, h, 12); ctx.stroke();
  // 购物袋图标（金色：袋身 + 提手）
  const ix = x + 17, iy = y + h / 2;
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#ffd166';
  ctx.fillStyle = 'rgba(255, 209, 102, .20)';
  roundRect(ix - 8, iy - 4, 16, 12, 3); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.arc(ix, iy - 4, 4.5, Math.PI, 0);   // 提手
  ctx.stroke();
  // 文案
  ctx.fillStyle = '#ffe08a';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('皮肤总览', x + 32, iy + 0.5);
  ctx.restore();
  skinShopHit = { x, y, w, h };
}

  const fail = () => setFMsg('复制失败，请手动长按选择复制', false);

    navigator.clipboard.writeText(myUid).then(done, fail);

  }
}

/* ---------- 主循环 ---------- */
let lastT = 0;   // 上一帧时间戳（delta time 归一化：高刷屏手感与 60Hz 一致）
function loop(now) {
  try {
    if (!lastT) lastT = now;
    let dt = (now - lastT) / (1000 / 60);   // 以 60fps 为基准的帧间隔系数
    lastT = now;
    if (dt > 3) dt = 3;                     // 切后台/卡顿后回来不跳变
    if (dt < 0 || dt !== dt) dt = 0;        // NaN 保护：时间戳异常时兜底
    update(dt);
    draw();
  } catch (e) {
    const stack = e && e.stack ? String(e.stack) : '';
    let ln = 0, cl = 0;
    const m = stack.match(/BossBird\.html:(\d+):(\d+)/);
    if (m) { ln = +m[1]; cl = +m[2]; }
    lastError = { msg: String(e && e.message || e), line: ln, col: cl, stack };
    try { drawErrorScreen(); } catch (_) {}
  }
  requestAnimationFrame(loop);
}

/* ---------- 输入处理 ---------- */
// 把屏幕坐标换算成画布内坐标（画布可能被 CSS 缩放）
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  return {
    x: (t.clientX - rect.left) * (canvas.width / rect.width),
    y: (t.clientY - rect.top) * (canvas.height / rect.height),
  };
}


// 持久化当前皮肤选择（登录用户按用户名隔离）
function persistSkin() {
  if (loggedIn && !isGuest) localStorage.setItem('bossBirdSkin_' + currentUser, currentSkin);
  else localStorage.setItem('bossBirdSkin', currentSkin);
}

// 用金币兑换皮肤：乐观扣币 + 请求后端，失败回滚
async function buySkin(id) {
  const s = SKINS[id];
  if (ownedSkins.has(id)) { currentSkin = id; persistSkin(); return; }
  if (walletCoins < s.price) {
    unlockMsg = '金币不足，还差 ' + (s.price - walletCoins) + ' 金币';
    unlockMsgTimer = 120;
    return;
  }
  // 乐观更新：先扣币、标记拥有并装备
  walletCoins -= s.price;
  ownedSkins.add(id);
  currentSkin = id;
  persistSkin();
  try {
    const r = await fetch('/api/buy-skin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ skin_id: id })
    });
    if (!r.ok) throw new Error('buy failed');
    const j = await r.json();
    walletCoins = j.coins;                       // 服务端权威校正
    ownedSkins = new Set(j.owned_skins.split(',').map(Number).filter(id => Number.isFinite(id)));
  } catch (e) {
    // 回滚
    walletCoins += s.price;
    ownedSkins.delete(id);
    unlockMsg = '购买失败，请重试';
    unlockMsgTimer = 120;
  }
}

// 商店换肤预览：浮层内 canvas 实时画一只静止的鸟，反映所选皮肤
const shopPreviewCanvas = document.getElementById('shopPreview');
const shopPreviewCtx = shopPreviewCanvas ? shopPreviewCanvas.getContext('2d') : null;
let lastPreviewId = -1;
function drawShopPreview(id) {
  if (!shopPreviewCtx) return;
  const s = SKINS[id] || SKINS[0];
  const W2 = shopPreviewCanvas.width, H2 = shopPreviewCanvas.height;
  shopPreviewCtx.clearRect(0, 0, W2, H2);
  const r = 28;
  shopPreviewCtx.save();
  shopPreviewCtx.translate(W2 / 2, H2 / 2);
  if (s.glow) { shopPreviewCtx.shadowColor = '#ffd700'; shopPreviewCtx.shadowBlur = 22; }
  if (s.body) {
    shopPreviewCtx.fillStyle = s.body;
  } else {
    const grd = shopPreviewCtx.createRadialGradient(-2, -2, 1.5, 0, 0, r + 3);
    grd.addColorStop(0, '#fff6c2'); grd.addColorStop(0.5, '#ffd700'); grd.addColorStop(1, '#d4880a');
    shopPreviewCtx.fillStyle = grd;
  }
  shopPreviewCtx.beginPath(); shopPreviewCtx.arc(0, 0, r, 0, Math.PI * 2); shopPreviewCtx.fill();
  shopPreviewCtx.shadowBlur = 0;
  if (s.id === 5) { shopPreviewCtx.strokeStyle = '#b9b9c8'; shopPreviewCtx.lineWidth = 1.5; shopPreviewCtx.stroke(); }
  else if (s.id === 6) { shopPreviewCtx.strokeStyle = '#7a6a9a'; shopPreviewCtx.lineWidth = 1.5; shopPreviewCtx.stroke(); }
  // 翅膀
  shopPreviewCtx.fillStyle = s.wing;
  shopPreviewCtx.beginPath(); shopPreviewCtx.ellipse(-3, 2, 10, 6, 0.3, 0, Math.PI * 2); shopPreviewCtx.fill();
  // 皇冠（黄金神鸟）
  if (s.crown) {
    shopPreviewCtx.fillStyle = '#ffd700'; shopPreviewCtx.strokeStyle = '#b8860b'; shopPreviewCtx.lineWidth = 1.2;
    const y = -r - 4;
    shopPreviewCtx.beginPath();
    shopPreviewCtx.moveTo(-7, y + 6); shopPreviewCtx.lineTo(-7, y + 1); shopPreviewCtx.lineTo(-3.5, y + 4);
    shopPreviewCtx.lineTo(0, y); shopPreviewCtx.lineTo(3.5, y + 4); shopPreviewCtx.lineTo(7, y + 1); shopPreviewCtx.lineTo(7, y + 6);
    shopPreviewCtx.closePath(); shopPreviewCtx.fill(); shopPreviewCtx.stroke();
  }
  // 嘴（皮肤 beak 色）
  shopPreviewCtx.fillStyle = s.beak || '#ff7a00';
  shopPreviewCtx.beginPath(); shopPreviewCtx.moveTo(r - 2, -2); shopPreviewCtx.lineTo(r + 9, 1); shopPreviewCtx.lineTo(r - 2, 5); shopPreviewCtx.closePath(); shopPreviewCtx.fill();
  // 眼睛（大眼炯炯有神：白眼球 + 黑瞳 + 白高光）
  shopPreviewCtx.fillStyle = '#fff'; shopPreviewCtx.beginPath(); shopPreviewCtx.arc(7, -4, 8, 0, Math.PI * 2); shopPreviewCtx.fill();
  shopPreviewCtx.fillStyle = '#1a1a1a'; shopPreviewCtx.beginPath(); shopPreviewCtx.arc(8, -4, 5, 0, Math.PI * 2); shopPreviewCtx.fill();
  shopPreviewCtx.fillStyle = '#fff'; shopPreviewCtx.beginPath(); shopPreviewCtx.arc(10, -6, 1.8, 0, Math.PI * 2); shopPreviewCtx.fill();
  shopPreviewCtx.restore();
}

  shopCoins.textContent = walletCoins;
  shopList.innerHTML = order.map((idx) => {
    const s = SKINS[idx];
    const owned = isUnlocked(s);

    if (on)           { label = '已装备';                          cls = 'done'; }
    else if (owned)   { label = isGuest ? '试玩' : '装备';          cls = 'equip'; }
    else if (isGuest) { label = '试玩';                             cls = 'equip'; }
    else if (walletCoins < s.price) { label = '差 ' + (s.price - walletCoins); cls = 'cant'; }
    else              { label = '购买 ' + s.price;                  cls = 'buy'; }
    const skillLine = s.skill || '基础角色，无特殊技能';
    const priceLine = owned ? (isGuest ? '游客试玩，数据不保存' : '已拥有') : '售价 ' + s.price + ' 金币';
    return '<div class="shopRow' + (on ? ' on' : '') + '" data-id="' + idx + '">' +
      '<span class="shopBird" style="background:' + dot + '"></span>' +

        '<div class="shopName">' + esc(s.name) + '</div>' +

// 商店里的点按：装备 / 试玩 / 购买
async function handleShopAction(id) {
  const s = SKINS[id];
  if (id === currentSkin) return;
  // 游客：沿用试玩次数规则（切回小黄鸟不消耗次数）
  if (isGuest) {
    if (id === 0) {
      currentSkin = 0; persistSkin();
      renderShop(); setShopMsg('已切回小黄鸟', true);
      return;
    }
    if (guestSkinTrials >= GUEST_TRIAL_MAX) {
      setShopMsg('试玩次数已用完（共 ' + GUEST_TRIAL_MAX + ' 次），可切回小黄鸟重玩', false);
      return;
    }
    guestSkinTrials++;
    currentSkin = id; persistSkin();
    renderShop(); setShopMsg('试玩中：' + s.name, true);
    return;
  }
  // 已拥有：直接装备
  if (ownedSkins.has(id)) {
    currentSkin = id; persistSkin();
    renderShop(); setShopMsg('已装备 ' + s.name, true);
    return;
  }
  // 未拥有：金币够才买（buySkin 内部乐观扣币 + 后端校正 + 失败回滚）
  if (walletCoins < s.price) {
    setShopMsg('金币不足，还差 ' + (s.price - walletCoins) + ' 金币', false);
    return;
  }
  await buySkin(id);
  renderShop();
  if (ownedSkins.has(id)) setShopMsg('购买成功，已装备 ' + s.name, true);
  else setShopMsg('购买失败，请重试', false);
}

// 翻页：delta 为 -1（上一页）或 1（下一页）
function goHistPage(delta) {
  const np = histPage + delta;
  if (np < 1 || np > histTotalPages) return;
  if (histLoading) return;        // 防抖：翻页请求进行中忽略重复点击，避免竞态跳错页
  histPage = np;                   // 乐观翻页：立即更新页号，下一帧 UI 即响应（不再"点了没反应"）
  history = [];                    // 清空当前页显示占位，等数据回填
  fetchHistory(np);
}

function onInput(e) {
  e.preventDefault(); // 防止手机上双击放大、空格滚动页面
  const p = canvasPos(e);
  handleTap(p);
}

// 一次「点击/轻点」的统一处理（桌面 mousedown 与移动端共用）
function handleTap(p) {
  // 点击右上角静音图标 -> 切换静音
  const mdx = p.x - (W - 28), mdy = p.y - 28;
  if (mdx * mdx + mdy * mdy <= 18 * 18) { muted = !muted; return; }
  // 待机界面：点击左上角退出按钮 -> 退出登录
  if (state === 'ready' && loggedIn) {
    const ldx = p.x - logoutHit.x, ldy = p.y - logoutHit.y;
    if (ldx * ldx + ldy * ldy <= logoutHit.r * logoutHit.r) { logout(); return; }
    // 点击左上角「好友」按钮 -> 打开好友面板
    const fdx = p.x - friendsBtnHit.x, fdy = p.y - friendsBtnHit.y;
    if (fdx * fdx + fdy * fdy <= friendsBtnHit.r * friendsBtnHit.r) { openFriendsPanel(); return; }
    // 点击历史分页按钮 -> 翻页
    for (const h of histHit) {
      const dx = p.x - h.x, dy = p.y - h.y;
      if (dx * dx + dy * dy <= h.r * h.r) { goHistPage(h.kind === 'prev' ? -1 : 1); return; }
    }
  }
  // 待机/结束界面：先判断是否点到了皮肤选择区
  if (state === 'ready' || state === 'over') {
    // 点击「技能图鉴」按钮 -> 打开图鉴浮层
    if (skillBtnHit) {
      const sdx = p.x - skillBtnHit.x, sdy = p.y - skillBtnHit.y;
      if (sdx * sdx + sdy * sdy <= skillBtnHit.r * skillBtnHit.r) { openSkillCodex(); return; }
    }
    // 点击底部「皮肤商店 ›」文字 -> 打开商店浮层
    if (skinShopHit) {
      const sh = skinShopHit;
      if (p.x >= sh.x && p.x <= sh.x + sh.w && p.y >= sh.y && p.y <= sh.y + sh.h) {
        openShop();
        return;
      }
    }
  }
  flap();
}
canvas.addEventListener('mousedown', onInput);
canvas.addEventListener('touchstart', onInput, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); flap(); }
  if (e.code === 'KeyM') { muted = !muted; }
});

// PWA：注册 Service Worker（添加到主屏幕 / 离线缓存）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// 注：已移除「同设备自动登录」——按需求每次进入游戏都必须手动输入账号与密码。

// 启动！
loop();
</script>
